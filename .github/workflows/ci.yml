name: CI & SonarCloud Quality Gate

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build-test-analyze:
    name: Build, Test, Complexity & SonarCloud Quality Gate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Desactiva shallow clone para analisis historico preciso de SonarCloud

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: 🛡️ Verify Architectural Rules & Cyclomatic Complexity (CC <= 5, MI >= 75)
        run: npm run lint:complexity

      - name: 📐 Verify Package Structural Metrics (Robert C. Martin D < 0.70)
        run: npm run audit:metrics

      - name: 💰 Run SQALE Financial Technical Debt Audit (Capers Jones F(MI))
        run: npm run audit:sqale

      - name: 🛡️ Run Test #1: Staleness Benchmark (Obsolescence & Conflict Detection)
        run: npm run test:staleness

      - name: 🧪 Run Test #2: Unit & Integration Tests with Coverage Report (LCOV)
        run: npm run test:coverage

      - name: ☁️ SonarCloud Scan
        if: matrix.os == 'ubuntu-latest' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: 🏆 SonarCloud Quality Gate Verification
        if: matrix.os == 'ubuntu-latest' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496 # v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
