# sonar-project.properties
# Configuracion Canonica de SonarCloud segun Seccion 9.3 de la Directriz Maestra

sonar.projectKey=ismaelUML_Canon
sonar.organization=ismaelumml
sonar.host.url=https://sonarcloud.io

# Definicion de fuentes y pruebas
sonar.sources=packages
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusiones de archivos generados, herramientas y caches
sonar.exclusions=**/generated/**,**/vendor/**,node_modules/**,dist/**,coverage/**,.canon/**
sonar.coverage.exclusions=**/tests/**,**/scripts/**,**/config/**

# Reporte de cobertura LCOV para TypeScript / JavaScript
sonar.javascript.lcov.reportPaths=coverage/lcov.info
